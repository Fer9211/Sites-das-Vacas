{% extends "base.html" %}
{% block head %}
    {{ super() }}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/configAmbiente.css') }}">
    <title>Configurar Ambiente</title>
{% endblock %}
{% block content %}
    <div class="configAmbientePeso">
        <h1>Novo peso</h1>
        <form class="formPeso" action="{{ url_for('despejos_blueprint.cadastrar_despejo') }}" method="post">
            <label for="pesoBase">peso ideal:</label>
            <input type="number" id="pesoBase" name="peso" step="0.01" placeholder="Kg">
            <label for="horario">Horário:</label>
            <input type="time" id="horario" name="horario" placeholder="horario definido:">
            <p><input class="botaoCadastrar" type = "submit" value = "Cadastrar" /></p>
        </form>
    </div>
    
{% endblock %}
